# Mochi for Noctalia: a little animated character that follows your AI coding
# agent sessions (Claude Code, Gemini CLI, Antigravity, Codex) and lets you
# approve permission requests or answer questions from the desktop.
#
# service -> follows `coucou-daemon --follow`, runs Mochi's state machine,
#            plays sounds, publishes everything to noctalia.state ("mochi")
#            IPC: noctalia msg plugin coucou/mochi:daemon all toggle-pause|pause|resume|open
# desktop -> the big animated Mochi (click, triple click, hover reactions)
# bar     -> mini Mochi + current tool; left click opens the panel, right click pauses
# sprite  -> shared: plays frames/ (the original Mochi engine, pre-rendered by
#            tools/render-mochi) and resolves the outfit setting
# panel   -> approval card (Allow / Deny) and AskUserQuestion answers
#
# Needs coucou-daemon running and its hooks installed (`coucou-daemon install-hooks`).

id = "coucou/mochi"
name = "Mochi"
version = "0.5.0"
plugin_api = 24
author = "gerickt"
license = "MIT"
icon = "mood-smile"
description = "Mochi watches your Claude Code and AI agent sessions from the desktop and the bar, and lets you approve or answer them with a click."
tags = ["ai", "agent", "desktop", "bar", "panel", "productivity"]
dependencies = ["coucou-daemon", "coucou-hook"]

[[setting]]
key = "sound_enabled"
type = "bool"
label_key = "settings.sound_enabled.label"
description_key = "settings.sound_enabled.description"
default = true

[[setting]]
key = "outfit"
type = "select"
label_key = "settings.outfit.label"
description_key = "settings.outfit.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.outfit.options.auto" },
  { value = "none", label_key = "settings.outfit.options.none" },
  { value = "partyHat", label_key = "settings.outfit.options.partyHat" },
  { value = "beanie", label_key = "settings.outfit.options.beanie" },
  { value = "crown", label_key = "settings.outfit.options.crown" },
  { value = "sunglasses", label_key = "settings.outfit.options.sunglasses" },
  { value = "roundGlasses", label_key = "settings.outfit.options.roundGlasses" },
  { value = "bow", label_key = "settings.outfit.options.bow" },
  { value = "scarf", label_key = "settings.outfit.options.scarf" },
  { value = "witchHat", label_key = "settings.outfit.options.witchHat" },
  { value = "pumpkin", label_key = "settings.outfit.options.pumpkin" },
  { value = "santaHat", label_key = "settings.outfit.options.santaHat" },
  { value = "bunnyEars", label_key = "settings.outfit.options.bunnyEars" },
]

[[service]]
id = "daemon"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  right = "plugin coucou/mochi:daemon all toggle-pause"

  [[widget.setting]]
  key = "show_tool"
  type = "bool"
  label_key = "settings.show_tool.label"
  description_key = "settings.show_tool.description"
  default = true

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "size"
  type = "int"
  label_key = "settings.size.label"
  description_key = "settings.size.description"
  default = 160
  min = 64
  max = 256

  [[desktop_widget.setting]]
  key = "show_tool"
  type = "bool"
  label_key = "settings.show_tool.label"
  description_key = "settings.show_tool.description"
  default = true

[[panel]]
id = "approval"
entry = "panel.luau"
width = 440
height = 420
