name: Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [daemon, hook]
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.crate }}
        run: cargo test --locked
        working-directory: ${{ matrix.crate }}
      - name: Build ${{ matrix.crate }}
        run: cargo build --release --locked
        working-directory: ${{ matrix.crate }}
